name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/db"
      WEB3_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/web3"
      JWT_SECRET: "dummy_jwt_secret"
      WEB3_INTERNAL_TOKEN: "dummy_internal_token"
      MAGIC_SECRET_KEY: "sk_test_mock_12345"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile > pnpm-install.log 2>&1 || {
            echo "### PNPM Install Log" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat pnpm-install.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log

      - name: Build Workspace
        run: pnpm build

      - name: Run Lint checks
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
