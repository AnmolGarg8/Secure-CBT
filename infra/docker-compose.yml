version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: securecbt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_local}
      POSTGRES_DB: ${POSTGRES_DB:-securecbt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: securecbt-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_local}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
